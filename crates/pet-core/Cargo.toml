[package]
name = "pet-core"
description = "Núcleo puro do bichinho: configuração, cérebro, animação e raster. Nunca depende de Wayland."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
# `raw_value`: o hook guarda só o texto cru dos campos da lista branca e
# pula o resto do JSON sem interpretar (decisão 0045).
serde_json = { workspace = true, features = ["raw_value"] }
toml.workspace = true
png.workspace = true
# Impressão digital da skin aprovada (decisão 0026).
sha2.workspace = true

[features]
# A janela de mentira (`plataforma::falsa`) para os testes de outros crates
# (o núcleo do daemon). Só entra nos testes.
teste = []
# O executor dos cenários (`cenario`) com a janela de mentira, para o
# `bichinho simular` (offline; decisão 0078).
simulacao = []

[lints]
workspace = true
