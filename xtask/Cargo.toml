[package]
name = "xtask"
description = "Ferramentas de desenvolvimento do bichinho (skins, arte, verificação de nitidez)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
pet-core.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
# Lê o .aseprite dos packs (skin-importar, zeca).
asefile = "0.3.8"
# GIFs das prévias (contato), com paleta exata: sem quantização.
gif = { version = "0.14.2", default-features = false, features = ["std", "raii_no_panic"] }
# Lê o .zip do pack em memória (zeca --pack <zip>).
flate2 = "1.1.10"
crc32fast = "1.5.2"
# Só para `cargo xtask carga` (cliente Wayland do host); o pet-core continua
# sem Wayland.
smithay-client-toolkit.workspace = true
rustix.workspace = true

[lints]
workspace = true
