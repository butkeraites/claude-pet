name: windows-instalar

# Prova o instalador por download no Windows (M9): monta o pacote
# (win-empacotar.ps1), roda o instalar-local.ps1 e confere que o Zeca **real**
# (a skin CC0 `zeca-livre-escuro`) sobe JÁ APROVADO, sem PET_DEBUG — o que valida
# a impressão digital do snapshot calculada no empacotamento —, com a chave Run
# e o binário no PATH. Runner windows-latest.
on:
  push:
    branches: [m8-windows]
    paths:
      - 'scripts/*.ps1'
      - 'crates/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'skins/zeca-livre-escuro/**'
      - '.github/workflows/windows-instalar.yml'
  workflow_dispatch: {}

jobs:
  instalar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Monta o pacote (win-empacotar.ps1)
        shell: pwsh
        run: scripts/win-empacotar.ps1 -Staging staging

      - name: Instala pelo pacote e confere
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & staging/instalar-local.ps1

          $e = Invoke-RestMethod -Uri "http://127.0.0.1:27380/v1/estado" -Headers @{ "X-Pet" = "1" } -TimeoutSec 5
          Write-Host "tela=$($e.tela)  skin=$($e.skin)  debug=$($e.debug)  versao=$($e.versao)  visivel=$($e.visivel)"

          $run = $null
          try { $run = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name Zeca -ErrorAction Stop).Zeca } catch {}
          Write-Host "Run key: $run"
          $up = [Environment]::GetEnvironmentVariable("Path", "User")
          $noPath = ($up -split ';') -contains (Join-Path $env:LOCALAPPDATA "bichinho\bin")
          Write-Host "bin no PATH do usuário: $noPath"

          # Conferência: o Zeca real subiu aprovado, sem debug, com autostart.
          if ($e.tela -ne "ativa") { throw "o Zeca não ficou aprovado (tela=$($e.tela)) — a impressão do snapshot pode não bater" }
          if ($e.debug) { throw "o daemon subiu em debug (não deveria, o instalador não passa PET_DEBUG)" }
          if (-not $run) { throw "a chave Run (autostart) não foi criada" }
          if (-not $noPath) { throw "o bin não entrou no PATH do usuário" }
          Write-Host "instalador OK: Zeca real aprovado (tela=ativa, sem debug), autostart (Run) e PATH prontos"

      - name: Para o daemon
        if: always()
        shell: pwsh
        run: Get-Process bichinho -ErrorAction SilentlyContinue | Stop-Process -Force
