name: windows-spike

# Spike (M8 Windows): compila e roda o overlay layered do Rust (crate `windows`,
# UpdateLayeredWindow, alfa por pixel) num runner windows-latest e sobe um
# screenshot do desktop — prova a técnica do pet-windows na tela, automático.
on:
  push:
    branches: [windows-spike]
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Compila o spike layered
        working-directory: tools/win-layered-spike
        run: cargo build --release

      - name: Roda o overlay + tira o screenshot
        shell: pwsh
        run: |
          $exe = "tools/win-layered-spike/target/release/win-layered-spike.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $vs = [System.Windows.Forms.SystemInformation]::VirtualScreen
          Write-Host "VirtualScreen: $($vs.Width)x$($vs.Height)"
          $bmp = New-Object System.Drawing.Bitmap $vs.Width, $vs.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($vs.X, $vs.Y, 0, 0, $vs.Size)
          $bmp.Save("$PWD/screenshot.png")
          $g.Dispose(); $bmp.Dispose()
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "screenshot salvo"

      - name: Sobe o screenshot
        uses: actions/upload-artifact@v4
        with:
          name: windows-layered-screenshot
          path: screenshot.png
          if-no-files-found: error
