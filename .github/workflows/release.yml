name: release

# Nos tags vX.Y.Z: compila, assina (ad-hoc) e empacota o Zeca por SO/arch, e
# sobe no release do GitHub (o `scripts/get.sh` baixa dali). O `workflow_dispatch`
# só compila/empacota (não publica), para testar a montagem.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            arch: arm64
          - runner: macos-13 # Intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Bichinho.app (compila + assina ad-hoc)
        env:
          CARGO: cargo
        run: scripts/mac-empacotar.sh staging/Bichinho.app

      - name: Pacote (app + skin CC0 aprovada + plugin + setup)
        run: |
          set -eux
          mkdir -p staging/skin
          cp -R skins/zeca-livre-escuro staging/skin/zeca-livre-escuro
          # A skin padrão já vai APROVADA: o fio da impressão é o sha256 duplo de
          # skin.json + sheet.json + sheet.png (como o bin/pet skin-aprovar).
          fp=$( cd staging/skin/zeca-livre-escuro && shasum -a 256 skin.json sheet.json sheet.png | shasum -a 256 | cut -d' ' -f1 )
          printf '{"id":"zeca-livre-escuro","sha256":"%s","aprovada_em_ms":%s000}\n' "$fp" "$(date +%s)" \
            > staging/skin/zeca-livre-escuro/aprovacao.json
          cp -R plugin staging/plugin
          cp -R .claude-plugin staging/.claude-plugin
          cp scripts/instalar-local.sh staging/instalar-local.sh
          tar -czf "zeca-macos-${{ matrix.arch }}.tar.gz" -C staging .
          ls -la "zeca-macos-${{ matrix.arch }}.tar.gz"

      - name: Publica no release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zeca-macos-${{ matrix.arch }}.tar.gz

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estável
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Compila o daemon
        run: cargo build --release -p bichinho

      # --- Assinatura Authenticode pelo SignPath Foundation (grátis p/ OSS) ---
      # Desligada até a org estar configurada: só roda quando a variável do repo
      # SIGNPATH_ORG_ID existir (veja docs/assinatura-windows.md). Sobe o exe
      # como artefato, o SignPath assina e devolve por cima do mesmo arquivo.
      - name: Sobe o exe não assinado (para o SignPath)
        if: ${{ vars.SIGNPATH_ORG_ID != '' }}
        id: exe_unsigned
        uses: actions/upload-artifact@v4
        with:
          name: bichinho-exe-unsigned
          path: target/release/bichinho.exe

      - name: Assina o bichinho.exe (SignPath)
        if: ${{ vars.SIGNPATH_ORG_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.exe_unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: target/release

      - name: Pacote (bichinho.exe + skin CC0 aprovada + plugin + setup)
        shell: pwsh
        run: |
          scripts/win-empacotar.ps1 -Staging staging -SkipBuild
          Compress-Archive -Path staging/* -DestinationPath zeca-windows-x64.zip -Force
          Get-Item zeca-windows-x64.zip | Format-List Name, Length

      - name: Publica no release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: zeca-windows-x64.zip
