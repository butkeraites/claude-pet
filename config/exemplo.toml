# Copie para config/bichinho.toml (fora do git) para mudar algo. O nome de
# antes, config/claude-pet.toml, ainda vale se o novo não existir.
# Precedência: comandos dados em tempo de execução (gravados em /state),
# depois variáveis PET_*, depois este arquivo, depois os padrões do código.
# `bin/pet estado` mostra o valor efetivo de cada chave e de onde ele veio.

[aparencia]
# Personagem: nome da pasta em skins/ ou skins-locais/. Cada skin só aparece
# depois de aprovada pela folha de contato (bin/pet skin-aprovar <id>).
#   "zeca-livre-escuro"  o Zeca original (CC0, no repositório) para tema
#                        escuro, com o anel de 1 px por fora: no tema escuro,
#                        sempre esta (sem o anel o contorno some no fundo)
#   "zeca-livre"         o Zeca original para tema claro
#   "zeca"               o Zeca do pack Cute Parrots! (bin/pet skin-instalar;
#                        fora do git); o padrão quando a chave falta
#   "zeca-contorno"      o do pack com contorno creme
# Trocar para uma skin já aprovada: bin/pet parar && bin/pet subir.
skin = "zeca"
# Tamanho do pet na tela: pequeno (~10% da altura do monitor), normal (~12%)
# ou grande (~16%). Muda só o D (pixels do monitor por pixel de arte, sempre
# inteiro), não a skin: não pede outra aprovação. Relido a cada aprovação; no
# mais, vale quando o pet reinicia (bin/pet parar && bin/pet subir). Ou
# PET_APARENCIA_TAMANHO=pequeno no ambiente do `bin/pet subir` ou no .env (o
# compose repassa; decisão 0046).
tamanho = "normal"

[celebracao]
# proporcional | sempre_grande | discreta | desligada
modo = "proporcional"

[sessoes]
# De onde vêm as sessões do Claude Code que o pet acompanha
# ($CLAUDE_CODE_ENTRYPOINT): "cli" é o terminal. Acrescente "sdk-cli" para
# contar também as execuções `claude -p`. Ou PET_SESSOES_ORIGENS="cli,sdk-cli"
# (no ambiente do `bin/pet subir` ou no .env).
origens = ["cli"]
