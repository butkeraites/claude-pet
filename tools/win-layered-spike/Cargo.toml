[package]
name = "win-layered-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Spike descartável (M8 Windows): prova a técnica do overlay do pet no Rust com
# o crate `windows` — uma janela layered (alfa por pixel), topmost, click-through,
# desenhada com UpdateLayeredWindow. Fica fora do workspace principal.
[workspace]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
] }
