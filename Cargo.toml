[workspace]
resolver = "3"
members = ["crates/pet-core", "crates/claude-pet", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/butkeraites/claude-pet"

[workspace.dependencies]
pet-core = { path = "crates/pet-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
signal-hook = "0.4.4"
png = "0.18.1"
# Wayland em Rust puro (sem libwayland, sem xkbcommon): o binário estático
# musl continua possível (decisão 0004).
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
rustix = { version = "1.1.4", features = ["process"] }
sha2 = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "abort"
